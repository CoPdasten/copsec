title: Sensitive Configuration and Key File Probing
id: sigma-web-secrets-exposure
status: production
level: high
tags:
  - attack.credential_access
  - attack.t1552.001
logsource:
  category: webserver
detection:
  selection:
    RequestURI|contains:
      - "/.env"
      - "/.git/config"
      - "/.git/HEAD"
      - "/wp-config.php"
      - "/id_rsa"
      - "/.aws/credentials"
  condition: selection
